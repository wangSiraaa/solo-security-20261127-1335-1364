[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coupon-provenance-demo"
version = "1.0.0"
description = "Local provenance, custody, correction and redemption demo for fictional scratch coupons"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coupon-demo = "coupon_demo.cli:main"

[tool.setuptools.packages.find]
include = ["coupon_demo*"]

[tool.setuptools.package-data]
coupon_demo = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
