[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-studio"
version = "1.0.0"
description = "Restricted declarative grid-font importer and atomic local subtitle compositor"
requires-python = ">=3.10"

[project.scripts]
subtitle-studio = "subtitle_studio.cli:main"

[tool.setuptools.packages.find]
include = ["subtitle_studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
