[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peripheral-handoff-service"
version = "1.0.0"
description = "Local simulated peripheral hand-off and provenance gate for a shared repair bench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
handoff = "handoff_service.cli:main"

[tool.setuptools.packages.find]
include = ["handoff_service*"]
