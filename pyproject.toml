[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-desk-simulation"
version = "1.0.0"
description = "Chain-of-custody intake and provenance-aware review desk simulation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["forensic_desk*"]
