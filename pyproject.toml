[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proofdesk"
version = "1.0.0"
description = "Local author delegation desk, proofreading terminal, trusted cabinet and revision library simulation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["proofdesk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
